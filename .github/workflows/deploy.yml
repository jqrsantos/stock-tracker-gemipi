name: Deploy Stock Tracker

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Deploy to Raspberry Pi
        run: |
          cd /home/joaosantos/stock-tracker
          git reset --hard
          git clean -fd
          git pull origin main
          docker compose up -d --build
